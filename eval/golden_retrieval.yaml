  - {q: "Who are the parties to the HDFC Bank personal loan agreement?", gold: [[P, 1]]}
  - {q: "How is interest compounded under the HDFC personal loan agreement?", gold: [[P, 1]]}
  - {q: "What repayment modes are accepted under the HDFC personal loan agreement?", gold: [[P, 1]]}
  - {q: "Under what conditions can HDFC Bank demand repayment within 24 hours on a personal loan?", gold: [[P, 1]]}
  - {q: "Are PDC instructions to HDFC Bank irrevocable under the personal loan agreement?", gold: [[P, 1]]}
  - {q: "Are processing or service charges refundable under the HDFC personal loan agreement?", gold: [[P, 1]]}
  - {q: "Within how many hours must a borrower pay after HDFC Bank calls in the personal loan under Clause 8?", gold: [[P, 1], [P, 2]]}
  - {q: "Within how many days must a borrower query an HDFC Bank statement before it is deemed accepted?", gold: [[P, 2]]}
  - {q: "Can a borrower partially prepay an HDFC personal loan?", gold: [[P, 2]]}
  - {q: "After how many EMIs is a borrower permitted to prepay the HDFC personal loan?", gold: [[P, 2]]}
  - {q: "Can HDFC Bank present post-dated cheques despite a stop payment instruction from the borrower?", gold: [[P, 2]]}
  - {q: "How many days' written notice is required before prepaying an HDFC personal loan?", gold: [[P, 2]]}
  - {q: "Within how many days may a borrower cancel an HDFC personal loan after disbursement?", gold: [[P, 2]]}
  - {q: "Can HDFC Bank sell or assign the personal loan to a third party without the borrower's consent?", gold: [[P, 2]]}
  - {q: "Which city's courts have jurisdiction over disputes under the HDFC personal loan agreement?", gold: [[P, 3]]}
  - {q: "Is liability joint and several when there are multiple borrowers under the HDFC personal loan?", gold: [[P, 3]]}
  - {q: "Can HDFC Bank disclose personal loan borrower information to CIBIL?", gold: [[P, 3]]}

