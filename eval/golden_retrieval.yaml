# Golden retrieval set: each question lists the page(s) whose text answers it.
# Used by eval/retrieval_eval.py to compute recall@5 and MRR for the hybrid retriever.
# P = HDFC Personal Loan Agreement (PL_Agreement.pdf)
# F = HDFC FAQ Credit Card and Debit Card (FAQMDCreditCardandDebitCard.pdf)
# B = HDFC Business Loans Terms and Conditions (personal_business_loan_agreement.pdf)
# C = HDFC Credit Card Cardmember Agreement (card-member-agreement-29-10-2019.pdf)
documents:
  P: "PL_Agreement.pdf"
  F: "FAQMDCreditCardandDebitCard.pdf"
  B: "personal_business_loan_agreement.pdf"
  C: "card-member-agreement-29-10-2019.pdf"

questions:
