# Golden retrieval set: each question lists the page(s) whose text answers it.
# Used by eval/retrieval_eval.py to compute recall@3 and MRR for the hybrid retriever.
# Markdown chunks are always page 1, so a .md gold means "any chunk of that file".
# Graded: 2 easy (direct lookup), 3 medium (one hop or paraphrase), 4 hard (a distractor document
# shares the vocabulary or numbers; the comment names it and what a hit proves).
# The previous 65-question set covered only the 4 original PDFs.
documents:
  R: "rbi_regulations.md"
  PM: "loanmitra_personal_loan.md"
  BM: "loanmitra_business_loan.md"
  M: "cc-mitc.pdf"

questions:
  # ── Easy ─────────────────────────────────────────────────────────────────
  - {q: "What is the minimum monthly net income needed to apply for an HDFC personal loan?", gold: [[PM, 1]]}
  - {q: "What is the repayment tenure range for an HDFC Business Loan?", gold: [[BM, 1]]}

  # ── Medium ───────────────────────────────────────────────────────────────
  # The MITC table of contents (page 1) also names "Interest free (grace Period)" but has no answer.
  - {q: "How long can the interest-free credit period on an HDFC credit card be?", gold: [[M, 10], [M, 33]]}
  # Paraphrase: no "property documents", "release" or "compensation" in the question.
  - {q: "My loan is fully repaid but the lender still has not returned my original house papers after a month. What do they owe me?", gold: [[R, 1]]}
  # Paraphrase of the non-utilisation charge.
  - {q: "What happens if I use less than 30% of my HDFC Dropline Overdraft limit?", gold: [[BM, 1]]}

  # ── Hard ─────────────────────────────────────────────────────────────────
  # Distractor: loanmitra_personal_loan.md has the same 4%/3%/2% foreclosure table. Proves product disambiguation.
  - {q: "Is there a foreclosure charge on a ₹30 lakh fixed-rate HDFC business loan taken by a micro enterprise?", gold: [[BM, 1]]}
  # Distractor: the cardmember agreement uses the legacy term "penal interest". Proves the regulator rule wins.
  - {q: "Can a lender charge interest on top of penal interest?", gold: [[R, 1]]}
  # Distractor: rbi_regulations.md and the RBI FAQ PDF give the generic 30-day / OTP rule. Proves the bank-specific term is found.
  - {q: "On which day after the card open date does HDFC close a credit card that was never activated or used?", gold: [[M, 17], [M, 39]]}
  # Distractor: the MITC calls itself a "Key Fact Statement" (pages 1-2). Proves the exclusion clause is found.
  - {q: "Does the RBI Key Facts Statement requirement for loans apply to credit card dues?", gold: [[R, 1]]}
