name: RAG Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI runs the production setup: Jina embeddings, Cohere rerank, Groq answers (app/config.py defaults),
# Python 3.13 and constraints.txt as in the Dockerfile. API keys come from repository secrets and are
# given only to the steps that call those APIs.
env:
  DATABASE_URL: postgresql+asyncpg://loanbot:loanbot@localhost:5432/loanbot
  JWT_SECRET_KEY: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
  UPLOAD_DIR: /tmp/uploads

jobs:
  evaluate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: loanbot
          POSTGRES_PASSWORD: loanbot
          POSTGRES_DB: loanbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-docker.txt
            requirements-dev.txt
            constraints.txt

      - name: Install Python dependencies
        run: pip install -r requirements-docker.txt -r requirements-dev.txt -c constraints.txt

      - name: Lint
        run: ruff check .

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Unit and API integration tests
        run: pytest -v

      - name: Retrieval quality gate (recall@3 / MRR on the golden set)
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          FORCE_REBUILD_VECTORSTORE: "true"
          RECALL_THRESHOLD: "0.80"
        run: python eval/retrieval_eval.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start backend
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 0 = unlimited; the eval user is a borrower and would hit the 10,000-token daily budget.
          GROQ_DAILY_BUDGET_TOKENS: "0"
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          # /health is 200 only once the database and the vector store are ready
          timeout 300 bash -c 'until curl -sf localhost:8000/health; do sleep 3; done'

      - name: Create eval user and access token
        env:
          ACCESS_TOKEN_EXPIRE_MINUTES: "120"
        run: |
          python - <<'EOF' >> "$GITHUB_ENV"
          import secrets, uuid
          import psycopg2
          from app.auth import create_access_token, hash_password
          conn = psycopg2.connect("postgresql://loanbot:loanbot@localhost:5432/loanbot")
          uid = uuid.uuid4()
          with conn, conn.cursor() as cur:
              cur.execute(
                  "INSERT INTO users (id, email, hashed_password, full_name, role, is_active, is_email_verified)"
                  " VALUES (%s, %s, %s, 'Eval Bot', 'borrower', true, true)",
                  (str(uid), f"eval-{uid.hex[:8]}@example.com", hash_password(secrets.token_urlsafe(16))),
              )
          print(f"EVAL_ACCESS_TOKEN={create_access_token({'sub': str(uid), 'role': 'borrower'})}")
          EOF

      - name: Run Promptfoo evaluation
        # --no-write: skip promptfoo's local SQLite history (0.102.0 crashes saving an eval there:
        # FOREIGN KEY constraint failed). -o still writes the results file the gate reads.
        run: npx promptfoo@0.102.0 eval --no-cache --no-write -o eval/promptfoo_results.json || true

      - name: Gate on promptfoo pass rate
        env:
          PASS_RATE_THRESHOLD: "0.9"
        run: python eval/check_pass_rate.py eval/promptfoo_results.json

      - name: Backend log on failure
        if: failure()
        run: tail -200 /tmp/backend.log || true
