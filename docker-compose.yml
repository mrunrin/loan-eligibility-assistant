services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_WARMUP_TIMEOUT: 20
      VECTORSTORE_PATH: /app/vectorstore
      AUDIT_LOG_PATH: /app/logs/audit.jsonl
      HF_HOME: /app/hf_cache
      SENTENCE_TRANSFORMERS_HOME: /app/hf_cache/sentence_transformers
      # Keep false for normal Docker runs because /app/vectorstore is persisted
      # in the Docker volume below. Set true only after PDFs change, rebuild once,
      # then set it back to false.
      RERANKER_ENABLED: "true"
      FORCE_REBUILD_VECTORSTORE: "false"
    ports:
      - "8000:8000"
    volumes:
      - vectorstore:/app/vectorstore
      - audit_logs:/app/logs
      - hf_cache:/app/hf_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_URL: http://backend:8000/ask/stream
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  vectorstore:
  audit_logs:
  hf_cache:
