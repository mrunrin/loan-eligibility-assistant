services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loanbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loanbot}
      POSTGRES_DB: ${POSTGRES_DB:-loanbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-loanbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VECTORSTORE_PATH: /app/vectorstore
      AUDIT_LOG_PATH: /app/logs/audit.jsonl
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loanbot}:${POSTGRES_PASSWORD:-loanbot}@postgres:5432/${POSTGRES_DB:-loanbot}
      UPLOAD_DIR: /app/uploads
      # Fixed here on purpose, not read from .env: reranking always on, and users never trigger a rebuild.
      RERANKER_ENABLED: "true"
      # Incremental ingestion: only new/changed files are re-embedded on startup.
      # The maintainer sets true here only to wipe and rebuild all embeddings, then back to false.
      FORCE_REBUILD_VECTORSTORE: "false"
    ports:
      # Loopback only: the browser talks to Streamlit; the API is reachable from this machine
      # for local tools (promptfoo, curl) but not from the network.
      - "127.0.0.1:8000:8000"
    volumes:
      - vectorstore:/app/vectorstore
      - audit_logs:/app/logs
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /health is 200 only when the database and the vector store are ready.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first start embeds the whole knowledge base through the Jina API; failures in this
      # window don't count, and the service turns healthy on the first passing check.
      start_period: 900s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # One-off demo data load:  docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loanbot}:${POSTGRES_PASSWORD:-loanbot}@postgres:5432/${POSTGRES_DB:-loanbot}
    volumes:
      - ./scripts:/app/scripts:ro
      - uploads:/app/uploads
    command: ["python", "scripts/seed_demo.py"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  vectorstore:
  audit_logs:
  uploads:
